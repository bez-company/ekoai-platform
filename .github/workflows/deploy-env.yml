name: Deploy de um ambiente

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      sha:
        type: string
        required: true

permissions:
  contents: read

env:
  REGION: southamerica-east1
  # Projeto de onde a produção promove a imagem que passou na staging (SPEC 013, E1.12).
  STAGING_PROJECT: ekoai-staging

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # Um deploy por ambiente por vez; um em andamento termina antes do próximo.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}

      - name: Variáveis do environment configuradas
        run: |
          for v in GCP_PROJECT WIF_PROVIDER DEPLOY_SA; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then echo "::error::Configure a variável $v no environment ${{ inputs.environment }}"; exit 1; fi
          done
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Staging sob demanda (SPEC 013, E1.11): se o banco estiver parado, liga já, enquanto as imagens
      # constroem; ligar leva cerca de 10 minutos. Produção nunca desliga: se não estiver de pé, o
      # deploy para e avisa.
      - name: Ligar o banco, se estiver parado
        run: |
          set -euo pipefail
          state=$(gcloud sql instances describe ekoai-pg --project "$PROJECT" --format='value(state)')
          echo "banco: $state"
          if [ "$state" = "RUNNABLE" ]; then exit 0; fi
          if [ "${{ inputs.environment }}" != "staging" ]; then
            echo "::error::o banco de produção está $state; deploy interrompido. Investigue antes de seguir."
            exit 1
          fi
          # Já há operação no banco (ele está ligando por outro deploy, pela tela "Ligar o ambiente"
          # ou pelo corte de ociosidade): um patch agora volta 409. O passo "Esperar o banco" espera.
          ops=$(gcloud sql operations list --instance ekoai-pg --project "$PROJECT" --filter='status!=DONE' --format='value(name)' --limit 5)
          if [ -n "$ops" ]; then
            echo "operação em andamento no banco ($ops); não peço para ligar de novo"
            exit 0
          fi
          policy=$(gcloud sql instances describe ekoai-pg --project "$PROJECT" --format='value(settings.activationPolicy)')
          if [ "$policy" = "ALWAYS" ]; then
            echo "o banco já foi pedido para ligar (ALWAYS); só falta subir"
            exit 0
          fi
          for i in 1 2 3; do
            if gcloud sql instances patch ekoai-pg --project "$PROJECT" --activation-policy=ALWAYS --quiet --async; then exit 0; fi
            echo "patch recusado (tentativa $i); outra operação pode ter começado, nova tentativa em 30 s"
            sleep 30
          done
          echo "::error::não consegui pedir para ligar o banco"
          exit 1

      # Staging constrói e empurra. Produção não constrói: promove, byte a byte, a imagem que passou
      # na staging (mesmo digest). O deploy usa sempre o digest, nunca a tag.
      - name: Imagens
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          REGISTRY="$REGION-docker.pkg.dev/$PROJECT/ekoai"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          digest() { gcloud artifacts docker images describe "$1" --format='value(image_summary.digest)'; }
          if [ "${{ inputs.environment }}" = "staging" ]; then
            docker build -f docker/platform.Dockerfile -t "$REGISTRY/platform:$SHA" .
            docker build -f docker/jobs.Dockerfile -t "$REGISTRY/jobs:$SHA" .
            docker push "$REGISTRY/platform:$SHA"
            docker push "$REGISTRY/jobs:$SHA"
          else
            SRC="$REGION-docker.pkg.dev/$STAGING_PROJECT/ekoai"
            for img in platform jobs; do
              want=$(digest "$SRC/$img:$SHA" 2>/dev/null || true)
              if [ -z "$want" ]; then
                echo "::error::não há $img:${SHA:0:7} no registry da staging. Produção só recebe imagem que passou por lá (scripts/release.sh); refaça o deploy da staging."
                exit 1
              fi
              docker pull --platform linux/amd64 "$SRC/$img@$want"
              docker tag "$SRC/$img@$want" "$REGISTRY/$img:$SHA"
              docker push "$REGISTRY/$img:$SHA"
              got=$(digest "$REGISTRY/$img:$SHA")
              if [ "$got" != "$want" ]; then
                echo "::error::o digest de $img mudou na cópia ($want na staging, $got em produção)."
                exit 1
              fi
            done
          fi
          for img in platform jobs; do
            d=$(digest "$REGISTRY/$img:$SHA")
            echo "$img: $d"
            echo "${img^^}_IMAGE=$REGISTRY/$img@$d" >> "$GITHUB_ENV"
          done

      # RUNNABLE sozinho não basta: o Cloud SQL ainda pode estar terminando a operação de ligar, e o
      # migrate morria com "connect ETIMEDOUT" (BEZ-120). Espera RUNNABLE e nenhuma operação pendente;
      # o migrate ainda tenta conectar de novo por cerca de 2 minutos (scripts/migrate.js).
      - name: Esperar o banco
        run: |
          set -euo pipefail
          for _ in $(seq 1 80); do
            state=$(gcloud sql instances describe ekoai-pg --project "$PROJECT" --format='value(state)')
            ops=$(gcloud sql operations list --instance ekoai-pg --project "$PROJECT" --filter='status!=DONE' --format='value(name)' --limit 5)
            echo "banco: $state${ops:+, operação em andamento: $ops}"
            if [ "$state" = "RUNNABLE" ] && [ -z "$ops" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::o banco não ficou RUNNABLE, sem operação pendente, em 20 minutos"
          exit 1

      # Migrations antes de trocar o código, e o deploy para se elas falharem.
      - name: Migrations
        run: |
          set -euo pipefail
          gcloud run jobs update ekoai-migrate --region "$REGION" --image "$JOBS_IMAGE" --quiet
          gcloud run jobs execute ekoai-migrate --region "$REGION" --wait

      - name: Jobs
        run: |
          set -euo pipefail
          for job in refresh-tokens token-health weekly-report tenant-create access-grant platform-admin; do
            gcloud run jobs update "ekoai-$job" --region "$REGION" --image "$JOBS_IMAGE" --quiet
          done

      - name: Plataforma
        run: |
          set -euo pipefail
          # O SHA vai no nome da revisão (K_REVISION, mostrado em /api/health). Variável de ambiente
          # não serve: o Terraform a desfaria no próximo apply. Refazer o deploy do mesmo commit (para o
          # serviço reler um segredo novo, por exemplo) acharia a revisão sha-<commit> já criada e o
          # Cloud Run recusaria o nome (BEZ-216): aí o sufixo leva o número e a tentativa deste run.
          suffix="sha-${SHA:0:7}"
          if gcloud run revisions describe "ekoai-platform-$suffix" --region "$REGION" --format='value(metadata.name)' >/dev/null 2>&1; then
            suffix="sha-${SHA:0:7}-r${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            echo "a revisão do commit já existe: este deploy cria ekoai-platform-$suffix"
          fi
          gcloud run services update ekoai-platform --region "$REGION" --image "$PLATFORM_IMAGE" \
            --revision-suffix "$suffix" --quiet
          URL=$(gcloud run services describe ekoai-platform --region "$REGION" --format 'value(status.url)')
          echo "URL=$URL" >> "$GITHUB_ENV"

      # Duas conferências: o processo de pé (/api/live, sem banco; falha aqui é imagem quebrada) e
      # o app alcançando o banco (/api/health). Logo depois de o banco ligar, a primeira conexão do
      # app pode levar uns 2 minutos (BEZ-120): até 3 minutos de espera.
      - name: Health check
        run: |
          set -euo pipefail
          live=""
          for i in $(seq 1 6); do
            live=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/live" || true)
            echo "live, tentativa $i: $live"
            if [ "$live" = "200" ]; then break; fi
            sleep 10
          done
          if [ "$live" != "200" ]; then
            echo "::error::a plataforma não subiu em $URL (/api/live respondeu $live)"
            exit 1
          fi
          for i in $(seq 1 18); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$URL/api/health" || true)
            echo "health, tentativa $i: $code"
            if [ "$code" = "200" ]; then cat /tmp/health.json; exit 0; fi
            sleep 10
          done
          echo "::error::a plataforma subiu, mas não alcança o banco em $URL (/api/health)"
          cat /tmp/health.json || true
          exit 1

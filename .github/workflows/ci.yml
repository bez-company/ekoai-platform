name: CI

# O que este workflow garante (ADR 0003):
#   - toda PR: testes, typecheck da plataforma, as migrations aplicadas (duas vezes)
#     num Postgres limpo sem comando destrutivo escondido, o isolamento por tenant (RLS)
#     testado e a varredura de segredo e de dependência; o job `CI ok` agrega tudo;
#   - as imagens da plataforma e dos jobs constroem e o Terraform valida (SPEC 010).
#
# O deploy fica em deploy.yml, um ambiente por branch (ADR 0013): `staging` publica no staging
# sozinho; `main` publica em produção depois da aprovação no environment `prod`. O CI de cada push
# nessas branches roda dentro do deploy.yml (workflow_call).
# Migration é ADITIVA (coluna nova, tabela nova): deploy e migration não são atômicos.

# No push de `staging` e `main` o CI roda como parte do deploy.yml (workflow_call), no mesmo run do
# deploy: assim o environment enxerga a branch certa. Aqui ficam a PR e o disparo manual.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Mínimo possível. Nenhum job precisa de mais que ler o repositório.
permissions:
  contents: read

jobs:
  test:
    name: Testes e typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Nenhum teste abre navegador; baixar o Chromium só deixaria o job lento.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platform/package-lock.json
      - run: npm ci
      # os testes da raiz importam módulos da plataforma (Next, firebase-admin)
      - run: npm ci
        working-directory: platform
      - run: npm test
      - name: Typecheck da plataforma
        working-directory: platform
        run: npx tsc --noEmit -p .

  identity-emulator:
    name: Login no emulador
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platform/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: platform
      # O runner já traz o Java 21 que o emulador precisa; projeto `demo-`, sem conta Google.
      - name: ID token do emulador do Firebase Auth (SPEC 009)
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          npm run emulator:test

  migrations-check:
    name: Migrations num banco limpo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Migration que apaga dado precisa de um aval explícito no próprio arquivo.
      - name: Sem comando destrutivo sem aval
        run: |
          set -euo pipefail
          falhou=0
          for f in supabase/migrations/*.sql; do
            if grep -qiE '^[[:space:]]*(drop (table|schema|column)|truncate|delete from|alter table [^;]*drop column)' "$f" \
               && ! grep -q -- '-- allow-destructive' "$f"; then
              echo "::error file=$f::comando destrutivo sem '-- allow-destructive' no arquivo"
              falhou=1
            fi
          done
          exit $falhou

      # As migrations antigas usam o que o Supabase já traz (papéis da API, auth.users, auth.uid()).
      # Num Postgres puro, o bootstrap cria o equivalente mínimo. Desde a 0015 nada ativo depende
      # do schema auth, e o teste de RLS reprova se voltar a depender (SPEC 008).
      - name: Base do Supabase
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/ci/bootstrap.sql

      # Duas passadas: a segunda prova que reaplicar é seguro (o banco de produção nunca
      # teve histórico de migrations; a primeira execução automática reaplica as antigas).
      - name: Aplicar todas as migrations, duas vezes
        run: |
          set -euo pipefail
          for passada in 1 2; do
            echo "== passada $passada"
            for f in supabase/migrations/*.sql; do
              echo "-- $f"
              psql "$PGURL" -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done

      # O banco aceita o que o código grava hoje (colunas novas das últimas migrations).
      - name: O schema aceita o que o código grava
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into tenants (id, name) values ('exemplo', 'Exemplo') on conflict (id) do nothing;
          insert into briefs (tenant_id, pillar, angle, idea, status)
            values ('exemplo', 'dica', 'precificacao', 'ci', 'producing');
          insert into pending_approvals (tenant_id, pending_id, channel, brief_id, generation, status)
            select 'exemplo', 'ci-linkedin', 'linkedin', id, '{"variations":[]}', 'rework_requested' from briefs limit 1;
          insert into scheduled_posts (tenant_id, channel, variation, caption_final, scheduled_for, brief_id, media_kind, utm)
            select 'exemplo', 'twitter', '{"id":1}', 'ci', now(), id, 'thread', '{"content":"d00000000"}' from briefs limit 1;
          insert into feedback (tenant_id, channel, aspect, sentiment, note)
            values ('exemplo', null, 'visual', 'negativo', 'fundo escuro');
          insert into style_rules (tenant_id, rule, aspect, source) values ('exemplo', 'sem emoji', 'tom', 'manual');
          insert into publishing_controls (tenant_id, paused) values ('exemplo', false)
            on conflict (tenant_id) do update set paused = excluded.paused;
          insert into post_events (tenant_id, post_id, type, payload) values ('exemplo', null, 'idea_decision', '{}');
          insert into engagements (tenant_id, kind, target_url, target_urn, parent_comment_urn, target_text, options, status)
            values ('exemplo', 'resposta', 'https://www.linkedin.com/feed/update/urn:li:activity:1/', 'urn:li:activity:1',
                    'urn:li:comment:(urn:li:activity:1,2)', 'texto', '["a"]', 'publicado');
          insert into engage_targets (tenant_id, name, profile_url) values ('exemplo', 'Ana', 'https://www.linkedin.com/in/ana/');
          insert into company_facts (tenant_id, kind, text, source) values ('exemplo', 'fact', 'Entrega no mesmo dia em Marília', 'site');
          insert into generation_runs (tenant_id, brief_id, step, input_hash, status, model, images, cost_usd, result)
            select 'exemplo', id, 'visual', repeat('a', 64), 'done', 'gemini-3.1-flash-image', 1, 0.0672, '{"key":"images/00000000-0000-4000-8000-000000000001.png"}' from briefs limit 1;
          insert into post_designs (tenant_id, brief_id, kind, ratio, layout, design)
            select 'exemplo', id, 'informativo', '4:5', 'lista-numerada', '{"texts":{"title":"ci"}}' from briefs limit 1;
          update pending_approvals set post_kind = 'informativo', post_design_id = (select id from post_designs limit 1) where pending_id = 'ci-linkedin';
          update briefs set post_kind = 'informativo', source = 'platform', error = null where idea = 'ci';
          insert into notifications (tenant_id, kind, level, title, body, link)
            values ('exemplo', 'publish.ok', 'info', 'Publicado no LinkedIn', null, '/history');
          SQL

      # Isolamento por tenant provado como o app acessa (authenticated com JWT), não como
      # superuser. Também barra tabela sem RLS, grant para anon e SECURITY DEFINER aberto.
      - name: RLS por tenant
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/ci/rls_test.sql

  security:
    name: Segredos e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # Catraca: varre só os commits novos. O histórico antigo tem falsos positivos
      # conhecidos (placeholders de .env.example e o exemplo de assinatura da doc do X).
      - name: Varredura de segredo nos commits novos
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          ./gitleaks git . --no-banner --redact --log-opts="$range"

      # As duas bloqueiam a partir de "alta" nas dependências de produção. O PostCSS que o Next 15
      # fixa foi trocado por um corrigido (override em platform/package.json); se um dia o Next
      # voltar a fixar uma versão vulnerável, o gate reprova aqui.
      - name: Dependências da raiz
        run: npm audit --omit=dev --audit-level=high
      - name: Dependências da plataforma
        working-directory: platform
        run: npm audit --omit=dev --audit-level=high

  data-layer:
    name: Camada de dados no Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ekoai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ekoai_test
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/ekoai_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platform/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: platform
      # O mesmo executor que o job `migrate` do Cloud Run usa em produção.
      - name: Migrations pelo executor
        run: npm run migrate
      - name: Consultas, módulos e executor de migrations contra o Postgres
        run: npm run test:db

  infra:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
      - name: Formatação
        run: terraform fmt -check -recursive infra/terraform
      # Sem backend: valida a sintaxe e as referências sem tocar no estado nem na nuvem.
      - name: Validação dos ambientes
        run: |
          set -euo pipefail
          for dir in envs/staging envs/prod envs/ekoai-site; do
            terraform -chdir=infra/terraform/$dir init -backend=false -input=false
            terraform -chdir=infra/terraform/$dir validate
          done

  containers:
    name: Imagens do Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plataforma
        run: docker build -f docker/platform.Dockerfile -t ekoai-platform:ci .
      - name: Jobs
        run: docker build -f docker/jobs.Dockerfile -t ekoai-jobs:ci .
      # O container sobe e o dispatcher recusa job que não existe.
      - name: Dispatcher dos jobs
        run: |
          set -euo pipefail
          # `|| true`: o container sai com erro de propósito; o que vale é a mensagem.
          saida=$(docker run --rm ekoai-jobs:ci nada 2>&1 || true)
          echo "$saida"
          echo "$saida" | grep -q "Job desconhecido"

  # A esteira é feature -> staging -> main (ADR 0013): PR só para a staging, vinda de uma branch de
  # feature. A main não recebe PR: ela só avança por fast-forward da release (scripts/release.sh).
  # Fora de PR (push, dispatch) o job passa, para o `CI ok` não contar um job pulado como falha.
  flow:
    name: Fluxo de branches
    runs-on: ubuntu-latest
    steps:
      - name: Base e origem da PR
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "não é PR: nada a conferir"; exit 0; fi
          case "$BASE" in
            staging)
              if [ "$HEAD" = "main" ] || [ "$HEAD" = "staging" ]; then
                echo "::error::PR para a staging vem de uma branch de feature, não de $HEAD."
                exit 1
              fi ;;
            main)
              echo "::error::A main não recebe PR. Abra esta PR com base staging; a release é o fast-forward de scripts/release.sh."
              exit 1 ;;
            *)
              echo "::error::PR com base $BASE: o fluxo é feature -> staging -> main (docs/adr/0013)."
              exit 1 ;;
          esac
          echo "ok: $HEAD -> $BASE"

  # Único check obrigatório na proteção da main e da staging: agrega os outros, então job novo entra
  # aqui sem mexer na configuração do GitHub.
  ci-ok:
    name: CI ok
    if: always()
    needs: [test, identity-emulator, migrations-check, data-layer, containers, infra, security, flow]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::algum job do CI não passou"
            exit 1
          fi
